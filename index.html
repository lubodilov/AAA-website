    <!-- Paint the right background before any CSS arrives -->
    <style>html,body{background:#0a0908;color:#ede9e3}html[data-theme=light],html[data-theme=light] body{background:#f4f1eb;color:#12100e}</style>
    <style>
      @font-face{font-family:UVN;src:url(/fonts/inter-tight.woff2) format('woff2');font-weight:100 900;font-display:swap}
      #boot{--ink:#0a0908;--mark:#ede9e3;--w:clamp(124px,13vw,184px);--dy:calc(var(--w)*-.2);--x:calc(var(--w)*.2272);position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;animation:boot-x 0s linear 1.6s both}
      html[data-theme=light] #boot{--ink:#f4f1eb;--mark:#12100e}
      #boot .d{position:absolute;inset:0;background:var(--ink);will-change:transform}
      #boot .l{clip-path:polygon(0 0,calc(50% + var(--x) - 18.8vh + 1px) 0,calc(50% + var(--x) + 18.8vh + 1px) 100%,0 100%);animation:boot-l .48s cubic-bezier(.76,0,.24,1) 1.1s both}
      #boot .r{clip-path:polygon(calc(50% + var(--x) - 18.8vh) 0,100% 0,100% 100%,calc(50% + var(--x) + 18.8vh) 100%);animation:boot-r .48s cubic-bezier(.76,0,.24,1) 1.1s both}
      #boot svg{position:absolute;left:50%;top:calc(50% + var(--dy));width:var(--w);height:auto;overflow:visible;transform:translate(-50%,-50%);fill:var(--mark)}
      #boot .p{transform-box:fill-box;animation:boot-in .42s cubic-bezier(.16,1,.3,1) both}
      #boot .p2{animation-delay:.05s}
      #boot .p3{animation-delay:.11s}
      #boot .s{fill:#ff2b1e;animation:boot-s .3s cubic-bezier(.3,1.5,.5,1) .38s both,boot-f .2s ease-in 1.14s forwards}
      #boot i{position:absolute;left:calc(50% + var(--x));top:50%;width:2px;height:108vh;margin:-54vh 0 0 -1px;background:#ff2b1e;box-shadow:0 0 22px 2px rgba(255,43,30,.65);transform:rotate(-20.6deg) scaleY(0);animation:boot-b .26s cubic-bezier(.16,1,.3,1) .84s both,boot-f .3s ease-out 1.22s forwards}
      #boot .n{position:absolute;left:0;right:0;top:calc(50% + var(--w)*.315);text-align:center;color:var(--mark);font:500 calc(var(--w)*.2)/1.2 UVN,'Inter Tight',ui-sans-serif,system-ui,sans-serif;letter-spacing:-.03em;white-space:nowrap}
      #boot .n span{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em;margin-bottom:-.12em}
      #boot .n b{display:inline-block;font-weight:inherit;animation:boot-w .5s cubic-bezier(.16,1,.3,1) .46s both}
      #boot .n span:nth-child(2) b{animation-delay:.53s}
      #boot .n span:nth-child(3) b{animation-delay:.62s;color:#ff2b1e}
      @keyframes boot-w{from{transform:translateY(112%)}to{transform:none}}
      @keyframes boot-in{from{opacity:0;transform:translateY(16%)}to{opacity:1;transform:none}}
      @keyframes boot-s{from{opacity:0;transform:translate(calc(-50% - 24px),calc(-50% - 64px))}to{opacity:1;transform:translate(-50%,-50%)}}
      @keyframes boot-b{to{transform:rotate(-20.6deg) scaleY(1)}}
      @keyframes boot-f{to{opacity:0}}
      @keyframes boot-l{to{transform:translate3d(-104%,0,0)}}
      @keyframes boot-r{to{transform:translate3d(104%,0,0)}}
      @keyframes boot-x{to{visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#boot{display:none}}
    </style>
